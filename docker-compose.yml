services:
  git-sync:
    image: alpine/git:latest
    container_name: sor_git_sync
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - GIT_USERNAME=${GIT_USERNAME}
      - GIT_TOKEN=${GIT_TOKEN}
    entrypoint: >
      /bin/sh -c "
      git config --global --add safe.directory /app;
      while true; do
        echo 'Sprawdzanie zmian na GitHub...';
        # Użycie tokenu do autentykacji przy fetch/pull
        git remote set-url origin https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/${GIT_USERNAME}/projekt-sor-system.git;
        git fetch origin main;
        LOCAL=\$$(git rev-parse HEAD);
        REMOTE=\$$(git rev-parse @{u});
        if [ \$$LOCAL != \$$REMOTE ]; then
          echo 'Wykryto zmiany! Pobieranie nowego kodu...';
          git pull origin main;
        fi;
        sleep 3600;
      done"
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    container_name: sor_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=twoje_bezpieczne_haslo
      - POSTGRES_DB=sor_system
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - sor_network

  backend:
    build: ./backend
    container_name: sor_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:twoje_bezpieczne_haslo@db:5432/sor_system
      - AI_SERVICE_URL=http://ai:8000/predict
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - sor_network

  ai:
    build: ./ai_service
    container_name: sor_ai
    restart: always
    ports:
      - "8001:8000"
    networks:
      - sor_network

networks:
  sor_network:
    driver: bridge
